<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 350px;
        }
        h2 {
            color: #333;
            font-weight: 600;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .input-group {
            position: relative;
            text-align: left;
            margin-bottom: 20px;
        }
        .input-group label {
            font-size: 14px;
            color: #555;
        }
        .input-group i {
            position: absolute;
            right: 12px;
            top: 40px;
            cursor: pointer;
            color: #777;
        }
        .signup-btn {
            background: #007bff;
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .signup-btn:hover {
            background: #0056b3;
        }
        .bottom-text {
            margin-top: 15px;
            font-size: 14px;
        }
        .bottom-text a {
            color: #28a745;
            text-decoration: none;
        }
        .bottom-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Admin Sign Up</h2>

        <form action="register.php" method="POST">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" name="full_name" required placeholder="Enter your full name">
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" id="password" required placeholder="Create a password">
                <i onclick="togglePassword()" id="togglePassword">👁️</i>
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" id="confirmPassword" required placeholder="Confirm your password">
                <i onclick="toggleConfirmPassword()" id="toggleConfirmPassword">👁️</i>
            </div>
            <button type="submit" class="signup-btn">Sign Up</button>
        </form>

        <div class="bottom-text">
            Already have an account? <a href="login.html">Log in</a>
        </div>
        <div class="bottom-text">
            <a href="home.html">⬅ Get Back to the Website</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            var passwordInput = document.getElementById("password");
            var toggleIcon = document.getElementById("togglePassword");
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleIcon.textContent = "🔒";
            } else {
                passwordInput.type = "password";
                toggleIcon.textContent = "👁️";
            }
        }

        function toggleConfirmPassword() {
            var confirmPasswordInput = document.getElementById("confirmPassword");
            var toggleIcon = document.getElementById("toggleConfirmPassword");
            if (confirmPasswordInput.type === "password") {
                confirmPasswordInput.type = "text";
                toggleIcon.textContent = "🔒";
            } else {
                confirmPasswordInput.type = "password";
                toggleIcon.textContent = "👁️";
            }
        }
    </script>
<div id="nav-placeholder"></div>

<script>
    // Load navigation menu from external file
    fetch("menu.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("nav-placeholder").innerHTML = data;
        })
        .catch(error => console.error("Error loading navigation:", error));
</script>

</body>
</html>
